name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |
            cd /path/to/project
            git pull origin main

            # Node.js Backend
            cd node-backend
            npm install
            npm run build
            pm2 restart node-backend || pm2 start npm --name node-backend -- start

            # Laravel Backend
            cd ../laravel-backend
            composer install --no-dev --optimize-autoloader
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Frontend
            cd ../frontend
            npm install
            npm run build
